<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Forgery Detection</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 2% auto;
            padding: 20px;
            border: 2px solid #ff4444;
            border-radius: 10px;
            width: 90%;
            max-width: 1200px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #000;
        }

        .analysis-header {
            text-align: center;
            color: #ff4444;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .view-selector {
            text-align: center;
            margin-bottom: 20px;
        }

        .view-selector select {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 2px solid #ff4444;
            background-color: white;
            cursor: pointer;
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .analysis-item {
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            background-color: #f9f9f9;
        }

        .analysis-item img {
            max-width: 100%;
            height: 140px;
            object-fit: contain;
            border-radius: 5px;
        }

        .analysis-item h3 {
            color: #333;
            margin: 10px 0;
        }

        .stats-box {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
        }

        .stats-box h3 {
            color: #856404;
            margin: 0 0 10px 0;
        }

        .stats-box p {
            margin: 5px 0;
            font-size: 16px;
        }

        .analysis-layout {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .original-section {
            flex: 1;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background-color: #f9f9f9;
        }

        .original-section img {
            max-width: 100%;
            height: 300px;
            object-fit: contain;
            border-radius: 8px;
        }

        .analysis-section {
            flex: 1;
            text-align: center;
            border: 2px solid #ff4444;
            border-radius: 8px;
            padding: 15px;
            background-color: #fff5f5;
        }

        .analysis-section img {
            max-width: 100%;
            height: 300px;
            object-fit: contain;
            border-radius: 8px;
        }

        .analysis-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        /* Inline analysis styles */
        .analysis-section-main {
            margin-top: 30px;
            padding: 20px;
            border: 2px solid #ff4444;
            border-radius: 10px;
            background-color: #fff5f5;
        }

        .analysis-header-main {
            text-align: center;
            color: #ff4444;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .stats-box-main {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
        }

        .stats-box-main h3 {
            color: #856404;
            margin: 0 0 10px 0;
        }

        .stats-box-main p {
            margin: 5px 0;
            font-size: 16px;
        }

        .view-selector-main {
            text-align: center;
            margin-bottom: 20px;
        }

        .view-selector-main select {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 2px solid #ff4444;
            background-color: white;
            cursor: pointer;
        }

        .analysis-layout-main {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .original-section-main {
            flex: 1;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background-color: #f9f9f9;
        }

        .original-section-main img {
            max-width: 100%;
            height: 300px;
            object-fit: contain;
            border-radius: 8px;
        }

        .analysis-section-main {
            flex: 1;
            text-align: center;
            border: 2px solid #ff4444;
            border-radius: 8px;
            padding: 15px;
            background-color: #fff5f5;
        }

        .analysis-section-main img {
            max-width: 100%;
            height: 300px;
            object-fit: contain;
            border-radius: 8px;
        }

        .analysis-grid-main {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .analysis-item-main {
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            background-color: #f9f9f9;
        }

        .analysis-item-main img {
            max-width: 100%;
            height: 140px;
            object-fit: contain;
            border-radius: 5px;
        }

        .analysis-item-main h3 {
            color: #333;
            margin: 10px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Title with detective image -->
    <div class="title-container">
        <h1>Document Forgery Detector</h1>
        <img src="/static/detective_image.png" alt="Detective" class="detective-image">
    </div>

    <p class="description">Upload document image to check if it's authentic or forged.</p>

    <div class="upload-container">
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" id="imageInput" name="file" accept="image/*" required>
            <button type="submit">Submit</button>
        </form>

        <div id="result" class="result-box" style="display:none;"></div>
        <div id="confidence" class="result-box" style="display:none;"></div>
        <img id="preview" src="" alt="Image Preview" style="display:none; max-width: 300px; margin-top: 20px;">
    </div>

    <!-- Inline analysis section -->
    <div id="analysisSection" class="analysis-section-main" style="display:none;">
        <div class="analysis-header-main">
            🚨 FORGERY DETECTED - Detailed Analysis 🚨
        </div>
        
        <div class="stats-box-main">
            <h3>Analysis Summary</h3>
            <p id="inlineConfidence"></p>
            <p id="inlineForgeryAreas"></p>
        </div>

        <div class="view-selector-main">
            <select id="inlineViewSelector">
                <option value="overlay">Show Overlay (Red/Yellow Areas)</option>
                <option value="heatmap">Show Heatmap</option>
                <option value="all">Show All Analysis Views</option>
            </select>
        </div>

        <div class="analysis-layout-main">
            <!-- Original document - always visible -->
            <div class="original-section-main">
                <h3>Original Document</h3>
                <img id="inlineOriginal" src="" alt="Original Document">
            </div>

            <!-- Analysis views - dynamic -->
            <div id="inlineSingleView" class="analysis-section-main">
                <img id="inlineSingleImageView" src="" alt="Analysis View">
                <h3 id="inlineSingleViewTitle"></h3>
            </div>

            <div id="inlineAllViews" class="analysis-grid-main" style="display: none;">
                <div class="analysis-item-main">
                    <img id="inlineHeatmap" src="" alt="Heatmap">
                    <h3>Forgery Detection Heatmap</h3>
                </div>
                <div class="analysis-item-main">
                    <img id="inlineOverlay" src="" alt="Overlay">
                    <h3>Detailed Overlay (Red/Yellow Areas)</h3>
                </div>
            </div>
        </div>
    </div>

    <footer>Forgery Detection Team</footer>
    <script src="/static/script.js"></script>
</body>
</html>
